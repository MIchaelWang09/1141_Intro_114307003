<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<script>
		document.write('<h1>114307003_Number Guessing Game</h1>');
		let resultDiv=document.createElement('div');
		document.body.appendChild(resultDiv);
		let chances=7;
		let max=100
		let min=1
		let guess=parseInt(window.prompt("請輸入1到100之間的整數"));
		let answer=Math.floor(Math.random() * 100 + 1);
		while(guess<=1 || guess>=100 || isNaN(guess)){
			guess=parseInt(window.prompt("請輸入有效範圍內的數字(不能超出1到100)"));
		}

		alert("你的輸入是:"+guess);

		while(chances>0 && guess!=answer){
			if(guess>answer){
				alert("太大了");max=guess;
			}else if(guess<answer){
				alert("太小了");min=guess;
			}
			if (min === answer) min++;
			if (max === answer) max--;
			chances--;

			alert("你還有"+chances+"次機會");

			if(chances>0){ 
				guess = parseInt(window.prompt("範圍（"+min+" 到 "+max+"之間）"));
				while (guess <= min || guess >= max || isNaN(guess)) {
					guess=parseInt(window.prompt("範圍（"+min+" 到 "+max+"之間）"));

				}}
			}
			if(guess===answer){
				alert("恭喜你猜對了，正確答案是"+answer);
				resultDiv.innerHTML='<img src="correct.jpg" alt="Correct!">';
			}
			else{
				alert("遊戲結束!正確答案是"+answer);
				resultDiv.innerHTML='<img src="wrong.jpg" alt="Wrong!">'
			}
		</script>
	</body>
	</html>
