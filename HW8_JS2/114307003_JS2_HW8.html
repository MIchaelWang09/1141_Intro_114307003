<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet"type="text/css"href="style.css">
	<title>JS Calculator</title>
</head>
<body>
<div class="calculator-container">
	<h1>JS Calculator</h1>
	<label>Number 1</label>
	<input id="num1" type="number"placeholder="Enter number">
	<label>Number 2</label>
	<input id="num2" type="number"placeholder="Enter number">
	<label>Operate Way?</label>
	<select id="operator">
		<option value="+">+</option>
		<option value="-">-</option>
		<option value="*">*</option>
		<option value="/">/</option>
	</select>
	<button id="calcBtn" onclick="calculate()">Add</button>
	<h3 id="resultDisplay">Result=0.00</h3>
</div>
<script src="script.js"></script>
</body>
</html>
